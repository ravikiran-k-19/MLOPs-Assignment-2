stages:
  prepare:
    cmd: python src/data_prep.py --raw_dir data/raw --output_dir data/processed
    deps:
      - src/data_prep.py
      - data/raw
    outs:
      - data/processed

  train:
    cmd: python src/train.py --data_dir data/processed --epochs 10 --batch_size 32
    deps:
      - src/train.py
      - src/model.py
      - data/processed
    outs:
      - model.h5

  evaluate:
    cmd: python src/evaluate.py --data_dir data/processed --model_path model.h5
    deps:
      - src/evaluate.py
      - model.h5
      - data/processed
    metrics:
      - metrics.json:
          cache: false
