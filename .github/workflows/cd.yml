name: CD — Deploy to Minikube via Helm

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        default: 'latest'

  workflow_run:
    workflows: ["CI — Lint, Test, Coverage, Build & Push"]
    types:
      - completed
    branches: [main]

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: self-hosted

    # Only deploy when CI completed successfully
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:

      # ==========================================================
      # 1. Checkout repository
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Checkout the exact commit that CI successfully built
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      # ==========================================================
      # 2. Verify required tools on self-hosted runner
      # ==========================================================
      - name: Verify Docker
        shell: powershell
        run: |
          docker --version

      - name: Verify kubectl
        shell: powershell
        run: |
          kubectl version --client

      - name: Verify Helm
        shell: powershell
        run: |
          helm version

      - name: Verify Minikube
        shell: powershell
        run: |
          minikube status


      # ==========================================================
      # 3. Deploy exact image created by CI
      # ==========================================================
      - name: Deploy with Helm
        shell: powershell
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}
        run: |
          Write-Host "=========================================="
          Write-Host "Deploying Cats-Dogs API"
          Write-Host "=========================================="
          Write-Host "Image:"
          Write-Host "$env:DOCKERHUB_USERNAME/cats-dogs-api:$env:IMAGE_TAG"
          Write-Host ""

          if ([string]::IsNullOrWhiteSpace($env:IMAGE_TAG)) {
            Write-Error "IMAGE_TAG is EMPTY"
            exit 1
          }

          helm upgrade --install cats-dogs-app deployment/helm `
            --set image.repository="$env:DOCKERHUB_USERNAME/cats-dogs-api" `
            --set image.tag="$env:IMAGE_TAG" `
            --wait `
            --timeout 1200s

      # ==========================================================
      # 4. Verify Kubernetes rollout
      # ==========================================================
      - name: Verify rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/cats-dogs-app --timeout=1200s

      # ==========================================================
      # 5. Show deployed resources
      # ==========================================================
      - name: Show deployment status
        shell: powershell
        run: |
          Write-Host "=========================================="
          Write-Host "Deployment"
          Write-Host "=========================================="
          kubectl get deployment cats-dogs-app

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Pods"
          Write-Host "=========================================="
          kubectl get pods -l app=cats-dogs-app -o wide

          Write-Host ""
          Write-Host "=========================================="
          Write-Host "Service"
          Write-Host "=========================================="
          kubectl get service cats-dogs-app


      # ==========================================================
      # 6. Start port forwarding for the smoke test
      # ==========================================================
      - name: Start port-forward
        shell: powershell
        run: |
          $portForward = Start-Process kubectl `
            -ArgumentList "port-forward service/cats-dogs-app 18000:80" `
            -PassThru `
            -WindowStyle Hidden

          Write-Host "Port-forward started with PID $($portForward.Id)"

          $ready = $false

          for ($i = 1; $i -le 30; $i++) {
              Start-Sleep -Seconds 1

              $connection = Test-NetConnection `
                  -ComputerName 127.0.0.1 `
                  -Port 18000 `
                  -WarningAction SilentlyContinue

              if ($connection.TcpTestSucceeded) {
                  $ready = $true
                  Write-Host "Port-forward is ready."
                  break
              }

              Write-Host "Waiting for port-forward... ($i/30)"
          }

          if (-not $ready) {
              Write-Error "Port-forward failed to start"
              Stop-Process -Id $portForward.Id -Force -ErrorAction SilentlyContinue
              exit 1
          }

          # Store PID for next step
          $portForward.Id | Out-File "$env:GITHUB_WORKSPACE\portforward.pid"

      # ==========================================================
      # 7. Run end-to-end smoke tests
      # ==========================================================
      - name: Run smoke tests
        shell: powershell
        run: |
          Write-Host "Testing port-forward with curl..."

          curl.exe -v http://127.0.0.1:18000/health

          Write-Host ""
          Write-Host "Running smoke tests..."

          .\deployment\smoke_test.ps1
      # ==========================================================
      # 8. Stop port forwarding post smoke test execution
      # ==========================================================
      - name: Stop port-forward
        if: always()
        shell: powershell
        run: |
          if (Test-Path "$env:GITHUB_WORKSPACE\portforward.pid") {
              $portForwardPid = Get-Content "$env:GITHUB_WORKSPACE\portforward.pid"

              if (Get-Process -Id $portForwardPid -ErrorAction SilentlyContinue) {
                  Stop-Process -Id $portForwardPid -Force
                  Write-Host "Port-forward stopped."
              }
          }
      
      # ==========================================================
      # 9. Deployment summary
      # ==========================================================
      - name: Deployment summary
        shell: powershell
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.event.workflow_run.head_sha }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "DEPLOYMENT SUCCESSFUL"
          Write-Host "=========================================="
          Write-Host "Image: $env:DOCKERHUB_USERNAME/cats-dogs-api:$env:IMAGE_TAG"
          Write-Host "Application: cats-dogs-app"
          Write-Host "Namespace: default"
          Write-Host ""
          Write-Host "Health check: PASSED"
          Write-Host "Prediction test: PASSED"
          Write-Host "=========================================="
          
