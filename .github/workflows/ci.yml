name: CI — Lint, Test, Coverage, Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-api

jobs:

  # ============================================================
  # 1. LINT + TEST + COVERAGE
  # ============================================================
  test:
    name: Lint, Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # --------------------------------------------------------
      # Dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      # --------------------------------------------------------
      # Linting
      # --------------------------------------------------------
      - name: Run flake8
        run: |
          flake8 . \
            --exclude=.git,__pycache__,.venv,venv,build,dist \
            --max-line-length=100

      # --------------------------------------------------------
      # Unit tests + coverage
      # --------------------------------------------------------
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      # --------------------------------------------------------
      # Upload coverage report
      # --------------------------------------------------------
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml


  # ============================================================
  # 2. DVC PULL + DOCKER BUILD + PUSH
  # ============================================================
  build-and-push:
    name: DVC Pull, Build Docker Image and Push
    runs-on: ubuntu-latest
    needs: test

    # Only build/push Docker images for direct pushes to main.
    # Pull requests run the test job only.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Python
      # --------------------------------------------------------
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # --------------------------------------------------------
      # Install project dependencies
      #
      # requirements.txt should contain:
      #
      # dvc==3.49.0
      # dvc-gdrive==3.0.1
      # pyOpenSSL==23.3.0
      # cryptography==41.0.7
      # --------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------------------------
      # Verify DVC / Google Drive dependency stack
      # --------------------------------------------------------
      - name: Verify DVC Google Drive stack
        run: |
          echo "=== Python ==="
          python --version

          echo "=== DVC ==="
          dvc --version
          pip show dvc
          pip show dvc-gdrive

          echo "=== Google Drive stack ==="
          pip show PyDrive2
          pip show oauth2client
          pip show google-api-python-client
          pip show google-auth
          pip show google-auth-oauthlib

          echo "=== OpenSSL stack ==="
          pip show pyOpenSSL
          pip show cryptography

          echo "=== OpenSSL API ==="
          python -c "import OpenSSL; print('pyOpenSSL:', OpenSSL.__version__)"
          python -c "from OpenSSL import crypto; print('crypto.sign exists:', hasattr(crypto, 'sign'))"

      # --------------------------------------------------------
      # Authenticate with Google Drive
      #
      # Store the COMPLETE service-account JSON as:
      # GDRIVE_CREDENTIALS_DATA
      # in GitHub repository secrets.
      # --------------------------------------------------------
      - name: Configure DVC Google Drive credentials
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          test -n "$GDRIVE_CREDENTIALS_DATA" || {
            echo "GDRIVE_CREDENTIALS_DATA secret is not configured"
            exit 1
          }

          dvc remote modify gdrive gdrive_use_service_account true

      # --------------------------------------------------------
      # Pull model tracked by DVC
      # --------------------------------------------------------
      - name: Pull model from DVC
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          for i in 1 2 3; do
            echo "DVC pull attempt $i..."

            if dvc pull --remote gdrive; then
              echo "DVC pull succeeded"
              break
            fi

            if [ "$i" -eq 3 ]; then
              echo "DVC pull failed after 3 attempts"
              exit 1
            fi

            echo "Retrying in 10 seconds..."
            sleep 10
          done

          echo "Checking DVC model..."

          test -f model.h5 || {
            echo "ERROR: model.h5 was not pulled from DVC remote"
            exit 1
          }

          ls -lh model.h5

      # --------------------------------------------------------
      # Docker Hub login
      # --------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # Build Docker image
      #
      # The image contains the REAL model pulled from DVC.
      # --------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${{ github.sha }} \
            .

      # --------------------------------------------------------
      # Push Docker image
      # --------------------------------------------------------
      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}
