name: CI — Lint, Test, Coverage, Build & Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cats-dogs-api

jobs:

  # ============================================================
  # 1. LINT + TEST + COVERAGE
  # ============================================================
  test:
    name: Lint, Unit Tests & Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-cov

      # --------------------------------------------------------
      # Linting
      # --------------------------------------------------------
      - name: Run flake8
        run: |
          flake8 . \
            --exclude=.git,__pycache__,.venv,venv,build,dist \
            --max-line-length=100

      # --------------------------------------------------------
      # Unit tests + coverage
      # --------------------------------------------------------
      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -v \
            --tb=short \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      # --------------------------------------------------------
      # Upload coverage report
      # --------------------------------------------------------
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml


  # ============================================================
  # 2. DVC PULL + DOCKER BUILD + PUSH
  # ============================================================
  build-and-push:
    name: DVC Pull, Build Docker Image and Push
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      # --------------------------------------------------------
      # Install DVC with Google Drive support
      # --------------------------------------------------------
      - name: Install DVC
        run: |
          python -m pip install --upgrade pip
          pip install "dvc[gdrive]==3.49.0"
          pip install "pathspec<0.12"

      # --------------------------------------------------------
      # Authenticate with Google Drive
      #
      # Store the COMPLETE service-account JSON as:
      # GDRIVE_CREDENTIALS_DATA
      # in GitHub repository secrets.
      # --------------------------------------------------------
      - name: Configure DVC Google Drive credentials
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          test -n "$GDRIVE_CREDENTIALS_DATA" || {
            echo "GDRIVE_CREDENTIALS_DATA secret is not configured"
            exit 1
          }

          dvc remote modify gdrive gdrive_use_service_account true

      # --------------------------------------------------------
      # Pull the model tracked by DVC
      # --------------------------------------------------------
      - name: Pull trained model and data from DVC
        env:
          GDRIVE_CREDENTIALS_DATA: ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run: |
          dvc pull --remote gdrive

          echo "Checking DVC model..."
          test -f model.h5 || {
            echo "ERROR: model.h5 was not pulled from DVC remote"
            exit 1
          }

          ls -lh model.h5

      # --------------------------------------------------------
      # Docker Hub login
      # --------------------------------------------------------
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --------------------------------------------------------
      # Build image using the REAL DVC-pulled model
      # --------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:latest \
            -t $IMAGE_NAME:${{ github.sha }} \
            .

      # --------------------------------------------------------
      # Push image
      # --------------------------------------------------------
      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:latest
          docker push $IMAGE_NAME:${{ github.sha }}